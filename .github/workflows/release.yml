# Pushing a version tag (for example v1.1.0) builds Sugarcane and publishes a GitHub Release
# with the .pkg installer and the .zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A copy without the version in its name, so scripts/get-sugarcane.sh can always fetch the latest
          cp "dist/Sugarcane-$version.zip" dist/Sugarcane.zip
          gh release create "$GITHUB_REF_NAME" \
            "dist/Sugarcane-$version.pkg" "dist/Sugarcane-$version.zip" dist/Sugarcane.zip \
            --title "Sugarcane $version" --generate-notes
